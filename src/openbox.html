<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chip Openbox</title><link rel="stylesheet" href="./openbox.css"><script defer src="./common/visualization/diagram-objects.js"></script><script defer src="./common/component-channel.js"></script><script defer src="./workflows/flash/flash.js"></script><script defer src="./workflows/standalone/standalone.js"></script><script defer src="./workflows/debug/debug.js"></script><script defer src="./common/visualization/component-connections.js"></script><script defer src="./common/visualization/pane-resizer.js"></script><link rel="stylesheet" href="./components/chip/visualization/chipset-selector.css"><script defer src="./components/chip/visualization/chipset-selector.js"></script><link rel="stylesheet" href="./common/visualization/pane-heading.css"><script defer src="./common/visualization/pane-heading.js"></script><script defer src="./openbox.js"></script><link rel="stylesheet" href="./common/visualization/diagram-objects.css"></head>
<body>
  <header><h1>Chip Openbox</h1><nav aria-label="Combined workspace"><button data-layout="scripts" aria-pressed="false">scripts</button><button data-layout="chip" aria-pressed="false">chip</button><button data-layout="board" aria-pressed="false">board</button><button data-layout="all" aria-pressed="true">All</button></nav><span>scripts + chip + board</span></header>
  <svg id="component-connections" aria-label="Static scripts to Flash to chip programming connections"><defs><marker id="component-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#008c90"/></marker></defs><g id="component-wire-paths"></g></svg>
  <main id="workspaces" data-layout="all">
    <section id="scripts-workspace" data-workspace="scripts"><div class="pane-heading"><strong>scripts</strong><div class="pane-controls" role="group" aria-label="Scripts controls"></div><a class="open-separately" href="./components/scripts/scripts.html" target="_blank" rel="noopener">Open separately ↗</a></div><iframe id="scripts-frame" src="./components/scripts/scripts.html" title="Scripts workspace"></iframe></section>
    <div class="pane-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize scripts and chip panes" aria-controls="scripts-workspace chip-workspace" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" title="Drag to resize panes; use left/right arrow keys"></div>
    <section id="chip-workspace" data-workspace="chip"><div class="pane-heading"><strong>chip / MCU</strong><div class="pane-controls" role="group" aria-label="Chip controls"></div><a class="open-separately" href="./components/chip/chip.html" target="_blank" rel="noopener">Open separately ↗</a></div><iframe id="chip-frame" src="./components/chip/chip.html" title="Chip workspace"></iframe></section>
    <div class="pane-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize chip and board panes" aria-controls="chip-workspace board-workspace" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" title="Drag to resize panes; use left/right arrow keys"></div>
    <section id="board-workspace" data-workspace="board"><div class="pane-heading"><strong>board</strong><div class="pane-controls" role="group" aria-label="Board controls"></div><a class="open-separately" href="./components/board/board.html" target="_blank" rel="noopener">Open separately ↗</a></div><iframe id="board-frame" src="./components/board/board.html" title="Board workspace"></iframe></section>
  </main>
</body></html>
